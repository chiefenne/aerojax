# NACA 0012 at Re = 6e6, alpha = 10 deg, SA-neg, on the chordwise-refined
# PyAero mesh examples/meshes/naca0012_pyaero_300k_y1_s450.su2 (C-type, 295k
# cells, 472 points per airfoil side, first cell 5e-6 chords, farfield
# 5 chords, outlet 25 chords) with the point-vortex farfield correction.
# Same numerics as naca0012_pyaero_rans.toml (D54); the two cases differ only
# in the surface resolution (113 vs 472 points per side).
# Result (8-core Intel iMac, 20-27 s per iteration): CL = 1.0827, CD = 0.01258
# (pressure 0.00625, viscous 0.00632); TMR (CFL3D, 897x257): CL 1.0909,
# CD 0.012311 (pressure 0.00606, viscous 0.00620). With 113 points per side
# the pressure drag is 0.00687. Table in docs/pyaero.md, section 8.

[case]
name = "naca0012_pyaero_rans_fine"

[mesh]
file = "../meshes/naca0012_pyaero_300k_y1_s450.su2"   # boundary faces: airfoil, inlet, outlet, top, bottom

[physics]
model = "rans"
turbulence = "sa-neg"

[fluid]
density = 1.0                     # kg/m^3
viscosity = 1.6666667e-7          # Pa s: Re = 6e6 with U = 1 m/s, c = 1 m

[reference]
velocity = 1.0                    # m/s
length = 1.0                      # m, chord
moment_center = [0.25, 0.0]       # m, quarter chord: also the vortex location
vortex_correction = true

[initial]
from_boundary = "inlet"

[boundary.airfoil]
type = "wall"

[boundary.inlet]
type = "farfield"
velocity = 1.0                    # m/s
angle_of_attack = 10.0            # deg
pressure = 0.0                    # Pa
turbulence = { nu_tilde_ratio = 3.0 }

[boundary.outlet]
type = "farfield"
velocity = 1.0
angle_of_attack = 10.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 3.0 }

[boundary.top]
type = "farfield"
velocity = 1.0
angle_of_attack = 10.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 3.0 }

[boundary.bottom]
type = "farfield"
velocity = 1.0
angle_of_attack = 10.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 3.0 }

[numerics]
limiter = "venkatakrishnan"       # local threshold for the start-up transient
limiter_freeze = { after_residual_drop = 1.5, after_iterations = 40, release = true }

[solver]
residual_drop = 7.0
max_iterations = 400
newton_krylov = { switch_at_residual_drop = 1.5, switch_at_iteration = 40 }
# Intel MKL PARDISO: 3.5x faster factorization than the default SuperLU
# ("direct"), needs the pypardiso package (conda install -c conda-forge
# pypardiso); remove the line or set type = "direct" without it.
linear_solver = { type = "pardiso" }

[output]
directory = "output/naca0012_pyaero_rans_fine"
force_boundaries = ["airfoil"]
